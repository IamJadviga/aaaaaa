name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11.10'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    container:
      image: python:3.11.10-slim
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate config.json.example
        run: |
          python -c "import json; json.load(open('config.json.example'))"
          echo "config.json.example is valid JSON"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      image: python:3.11.10-slim
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

  package:
    name: Package
    runs-on: ubuntu-latest
    container:
      image: python:3.11.10-slim
    needs: test
    if: github.ref == 'refs/heads/main' && github.event.pull_request.draft == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create dist directory
        run: |
          mkdir -p dist
          cp aaa.py dist/
          cp dockerfile dist/
          cp examples.txt dist/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist/
          retention-days: 7

    deploy_test:
      name: Deploy to Test
      runs-on: ubuntu-latest
      needs: package
      if: github.ref == 'refs/heads/main'
      environment:
        name: test/converter
        url: http://localhost:8104
      
      steps:
        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: dist-package
            path: deploy/test/
        
        - name: Check DEPLOY_TOKEN
          env:
            DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          run: |
            if [ -z "$DEPLOY_TOKEN" ]; then
              echo "DEPLOY_TOKEN is not set"
              exit 1
            fi
            echo "DEPLOY_TOKEN is set (value hidden)"
        
        - name: Smoke test
          run: |
            cd deploy/test
            python converter.py &
            sleep 2
            curl -s "http://localhost:8004/convert?value=1.5" | grep -q "1500"
            echo "Smoke test passed"
            kill %1 || true
        
        - name: Create deployment report
          run: |
            echo "Deployment successful" > deployment.txt
            echo "Commit: ${{ github.sha }}" >> deployment.txt
            echo "Time: $(date)" >> deployment.txt
            echo "Environment: test/converter" >> deployment.txt